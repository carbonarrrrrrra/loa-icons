name: Update icons and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: astrum-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install UnityPy==1.25.4
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: python scripts/update_icons.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save updated catalog
        run: |
          git config user.name 'Astrum Icons Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site
          if ! git diff --cached --quiet; then
            git commit -m 'Update JP character icons'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
